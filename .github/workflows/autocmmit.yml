name: Auto commit

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update file and push
        run: |
          date -u > LAST_UPDATED
          git config user.name "Nischal8889"
          git config user.email "Nischal8889@users.noreply.github.com"
          git add LAST_UPDATED
          git commit -m "chore(bot): auto commit"
          git push
